<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Smart Attendance System</title>
    <!-- Favicon derived from teajas.jpeg by make-favicon.py; .ico holds 16/32/48. -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon admin"><i class="fa-solid fa-shield-halved"></i></div>
                <h2>Admin Login</h2>
            </div>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" id="username" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-wrap">
                        <input type="password" class="form-input" id="password" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="submitBtn">
                    <span class="btn-text">Sign In</span>
                    <span class="loader"><span></span><span></span><span></span></span>
                </button>
            </form>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="admin-login.js"></script>
</body>
</html>
